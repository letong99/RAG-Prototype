[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-service"
version = "0.1.0"
description = "Versioned document ingestion for a Python RAG service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "mcp>=1.26,<2",
  "qdrant-client>=1.20,<2",
  "sentence-transformers>=5.7,<6",
  "datasets>=3.2,<5",
  "pypdf>=5,<7",
  "filelock>=3.16,<4",
  "langchain-text-splitters>=1,<2",
  # PyTorch's final Intel macOS wheels are 2.2.x. Keep its NumPy/Transformers ABI compatible.
  "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyarrow>=21,<22; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.41,<4.50; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
rag = "rag_service.cli:main"
rag-mcp = "rag_service.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires a downloaded embedding model",
  "remote: requires an explicitly configured disposable Qdrant test endpoint",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", ".tools", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/rag_service"]

[[tool.mypy.overrides]]
module = ["datasets.*", "sentence_transformers.*", "transformers.*", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"
